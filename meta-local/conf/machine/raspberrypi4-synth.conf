require conf/machine/raspberrypi4-64.conf

MACHINEOVERRIDES =. "raspberrypi4-64:"

require conf/machine/rpi-synth-common.inc

# Built-in audio on the 3.5 mm jack (PWM, snd_bcm2835); the DTS disables it
# by default (snd_bcm2835.enable_headphones=0 in /chosen/bootargs)
RPI_EXTRA_CONFIG += "\ndtparam=audio=on\n"
