header:
  version: 14

distro: poky

repos:
  # this repo contains meta-local
  meta-local:
    layers:
      meta-local:

  poky:
    url: https://git.yoctoproject.org/poky
    branch: scarthgap
    layers:
      meta:
      meta-poky:

  meta-openembedded:
    url: https://git.openembedded.org/meta-openembedded
    branch: scarthgap
    layers:
      meta-oe:
      meta-multimedia:
      meta-networking:
      meta-python:

  meta-raspberrypi:
    url: https://git.yoctoproject.org/meta-raspberrypi
    branch: scarthgap

local_conf_header:
  license: |
    LICENSE_FLAGS_ACCEPTED = "synaptics-killswitch"
  debug: |
    # passwordless root -- development setting, not for a networked device
    EXTRA_IMAGE_FEATURES += "debug-tweaks"
  # Shared download and sstate cache in yocto-cache/, a sibling of the
  # directory holding this repo clone (TOPDIR is <clone>/build). Weak
  # defaults (?=): DL_DIR/SSTATE_DIR exported in the shell still win,
  # because kas passes them through to bitbake before local.conf is
  # parsed. Without this, a shell lacking those variables silently falls
  # back to an empty build/sstate-cache and rebuilds everything.
  cache: |
    DL_DIR ?= "${TOPDIR}/../../../yocto-cache/downloads"
    SSTATE_DIR ?= "${TOPDIR}/../../../yocto-cache/sstate-cache"
